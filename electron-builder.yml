appId: com.custard.app
productName: Custard
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!{plugin,test,scripts,out-test}/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
  # esbuild runs a native binary to build plugins.
  - node_modules/esbuild/**
  - node_modules/@esbuild/**
# Plugin sources, the SDK and its docs, read by the plugin host. Plugin
# build and activation were tested in the packaged Linux build on 2026-10-09
# (test/platform/README.md); Windows and macOS packaged builds are not.
extraResources:
  - from: plugin
    to: plugin
  - from: src/plugin-sdk
    to: plugin-sdk
    filter: ['*.ts', '!*.test.ts']
  - from: docs/plugins
    to: docs/plugins
  # The plugin type check reads TypeScript's lib.*.d.ts; electron-builder drops
  # .d.ts files from node_modules, so they ship here.
  - from: node_modules/typescript/lib
    to: typescript-lib
    filter: ['lib*.d.ts']
# Release builds: each installer is built on its own OS and CPU, because
# esbuild ships one native binary per platform and npm installs only the
# host's. A Windows build made on Linux carries Linux's esbuild.
win:
  executableName: custard
  target:
    - target: nsis
      arch: x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
# macOS: dmg and zip for the host CPU (arm64 on Apple Silicon runners, x64 on
# Intel ones). No Developer ID yet, so the app is ad-hoc signed ("-"), which
# Apple Silicon needs to run it at all. Hardened runtime is off because with an
# ad-hoc signature it rejects Electron's pre-signed frameworks; it is only
# needed for notarization. Gatekeeper still blocks the first open.
mac:
  target:
    - dmg
    - zip
  identity: '-'
  hardenedRuntime: false
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  notarize: false
dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}
linux:
  target:
    - AppImage
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
# Release builds: Electron fuses flipped in the binary (docs/design/SANDBOX.md,
# "Release fuses"). ELECTRON_RUN_AS_NODE, NODE_OPTIONS / NODE_EXTRA_CA_CERTS
# and --inspect are ignored; only app.asar is loaded, and its integrity is
# checked where Electron supports it (macOS, Windows). Packaged test builds
# (electron-builder.test.yml, npm run build:unpack:test) leave them as they
# are, because the e2e harness drives the app through --inspect.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
# Where electron-builder uploads when it publishes (--publish, or in CI on a
# tag): a draft GitHub Release that Neno publishes by hand. Local builds
# without a GH_TOKEN don't upload. There is no auto-update.
publish:
  provider: github
  owner: V3-neno
  repo: custard
  releaseType: draft
